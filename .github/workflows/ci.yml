name: CI

on:
  push:
    branches: [master, dev]
    # Tags are release.yml's: it calls this workflow itself before releasing.
    tags-ignore: ["**"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:
  # release.yml runs exactly these jobs as its gate — one definition of
  # "the tests pass", not a copy that drifts.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          # One cache per Python: the three jobs finish together, and on a
          # shared key all but the first fail to save it ("unable to reserve").
          cache-suffix: py${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check src tests

      # Offline by design (stub clients, pre-supplied content). In parallel
      # across the runner's cores: serially it took 13-15 minutes a job, and
      # Actions minutes are a monthly budget. The suite is built to hold
      # under parallel load (tests/waiting.py).
      - name: Test
        run: uv run --python ${{ matrix.python-version }} pytest -q -n auto
        timeout-minutes: 20

      - name: Build
        run: uv build --out-dir dist

      - name: Upload artifacts
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install:
    name: install wheel (py${{ matrix.python-version }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build
        run: uv build --out-dir dist

      # A bare venv with nothing but the wheel: catches a missing runtime
      # dependency, a package the build backend dropped, and a console script
      # that does not import.
      - name: Install into a bare venv and smoke-test
        run: |
          uv venv --python ${{ matrix.python-version }} /tmp/bare
          VIRTUAL_ENV=/tmp/bare uv pip install dist/*.whl
          /tmp/bare/bin/mmw --help
          # apply.py ships inside every bundle — if it is missing from the
          # wheel, bundling produces an archive the far side cannot apply.
          /tmp/bare/bin/python -c "from mmw.resources import apply_script_bytes; assert apply_script_bytes()"

  vscode-client:
    name: VS Code client (isolated offline network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Sync test dependencies
        run: uv sync --python 3.13

      # Only tooling preparation uses the internet. The test's Compose
      # network is internal, images never pull, and no host port is exposed.
      - name: Prepare gallery, nginx and Microsoft client images
        run: |
          mkdir -p .superpowers/work
          docker pull python:3.13-slim
          docker pull --platform linux/amd64 nginx:latest
          docker build -t mmw-vscode-client:local -f tests/e2e/client.Dockerfile tests/e2e \
            > .superpowers/work/vscode-client-build.log 2>&1

      - name: Real client against live publish and applied bundle
        env:
          MMW_VSCODE_E2E: "1"
        run: |
          uv run --python 3.13 pytest -q tests/test_vscode_client_e2e.py \
            --basetemp=.superpowers/work/vscode-client-e2e

      - name: Upload client and server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vscode-client-logs
          include-hidden-files: true
          path: |
            .superpowers/work/vscode-client-build.log
            .superpowers/work/vscode-client-e2e/**/*.log
            .superpowers/work/vscode-client-e2e/**/probe.json

  apply-script-compat:
    # `resources/apply.py` and `resources/sign.py` are the only parts of mmw
    # that run on the far side of an airgap: no mmw install, no pip, sometimes
    # Python 3.6 (RHEL 8). 3.8 is
    # the oldest interpreter GitHub-hosted runners still provide, so this job
    # catches 3.9+ syntax but NOT a 3.7/3.8-only construct. The residual gap
    # (3.6, 3.7) is unguarded here — `tests/` enforces the stdlib-only import
    # allowlist, and nothing in CI can exercise the real RHEL 8 interpreter.
    name: far-side scripts compile on the oldest available interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: py_compile under Python 3.8
        run: |
          uv python install 3.8
          uv run --python 3.8 --no-project python -m py_compile \
            src/mmw/resources/apply.py src/mmw/resources/sign.py
