name: Release

on:
  push:
    tags:
      - "v*"
  # Uploads the files already attached to past GitHub releases — the
  # history PyPI never had. Re-runnable: files already there are skipped.
  workflow_dispatch:
    inputs:
      index:
        description: "Where to upload (rehearse on testpypi first)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  # The whole CI pipeline — tests on 3.10–3.13, wheel install, apply.py on an
  # old interpreter — exactly as it runs on dev, called rather than copied.
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A manual bump invites tagging v0.10.0 while pyproject.toml still says
      # 0.9.0, which would publish a mislabelled wheel with no warning. And a
      # release with no changelog section has nothing to say what it is.
      - name: Tag matches pyproject.toml and CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag, pyproject.toml says $ver"
            exit 1
          fi
          if ! grep -q "^## \[$ver\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$ver]' section"
            exit 1
          fi
          echo "tag, pyproject.toml and CHANGELOG.md agree on $ver"

      # master only ever advances to a commit that is already on dev — a tag
      # on some other branch must not become production.
      - name: Tagged commit is on dev
        run: |
          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::$GITHUB_SHA is not on dev — tag the release commit on dev"
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: [ci, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build
        run: uv build --out-dir dist

      # The release notes are this version's CHANGELOG.md section, verbatim.
      - name: Extract release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  # PyPI gets exactly the files the GitHub release carries — downloaded from
  # it, not rebuilt. Trusted publishing: PyPI trusts this workflow in the
  # `pypi` environment, so no token exists to leak.
  pypi:
    runs-on: ubuntu-latest
    needs: release
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # master is a pointer to the latest release, so it only ever moves here —
  # after PyPI has it too. Pushed WITHOUT --force: a direct commit to master
  # makes this fail, which is the point — the invariant is broken and a
  # human should look, rather than have it silently clobbered.
  master:
    runs-on: ubuntu-latest
    needs: pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward master to the released commit
        run: git push origin "$GITHUB_SHA:refs/heads/master"

  # Manual: every past GitHub release's files, uploaded as they were built.
  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.index }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download every release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist \
              --pattern '*.whl' --pattern '*.tar.gz'
          done
          ls -l dist

      - name: Upload to ${{ inputs.index }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          skip-existing: true
