name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The whole CI pipeline — tests on 3.11–3.13, wheel install, apply.py on an
  # old interpreter — exactly as it runs on dev, called rather than copied.
  ci:
    uses: ./.github/workflows/ci.yml

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A manual bump invites tagging v0.10.0 while pyproject.toml still says
      # 0.9.0, which would publish a mislabelled wheel with no warning. And a
      # release with no changelog section has nothing to say what it is.
      - name: Tag matches pyproject.toml and CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies version $tag, pyproject.toml says $ver"
            exit 1
          fi
          if ! grep -q "^## \[$ver\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$ver]' section"
            exit 1
          fi
          echo "tag, pyproject.toml and CHANGELOG.md agree on $ver"

      # master only ever advances to a commit that is already on dev — a tag
      # on some other branch must not become production.
      - name: Tagged commit is on dev
        run: |
          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
            echo "::error::$GITHUB_SHA is not on dev — tag the release commit on dev"
            exit 1
          fi

  release:
    runs-on: ubuntu-latest
    needs: [ci, verify]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build --out-dir dist

      # The release notes are this version's CHANGELOG.md section, verbatim.
      - name: Extract release notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" '
            index($0, h) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      # master is a pointer to the latest release, so it only ever moves here.
      # Pushed WITHOUT --force: a direct commit to master makes this fail,
      # which is the point — the invariant is broken and a human should look,
      # rather than have it silently clobbered.
      - name: Fast-forward master to the released commit
        run: git push origin "$GITHUB_SHA:refs/heads/master"
