[project]
name = "mirror-mirror-on-the-wall"
version = "1.3.0"
description = "Mirror APT repositories, PyPI and VS Code for airgapped networks — exact upstream layouts at the real hostnames, signatures preserved, one deduplicated pool"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Sam Morgan", email = "sam.morgan44@gmail.com" }
]
keywords = ["mirror", "apt", "debian", "ubuntu", "pypi", "pip", "vscode", "repository", "airgap", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = [
    "h2>=4.3.0",
    "packaging>=25.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4,<3",
    "textual>=8.2.8,<9",
    "tomli-w>=1.2.0",
    "typer>=0.25.1",
    "uv>=0.11.23,<0.12",
    "cryptography>=44.0.0",
    "zstandard>=0.25.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/samikool/mirror-mirror-on-the-wall"
Repository = "https://github.com/samikool/mirror-mirror-on-the-wall"
Issues = "https://github.com/samikool/mirror-mirror-on-the-wall/issues"

[project.scripts]
mmw = "mmw.cli:app"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mmw"
# A downstream packager needs to be able to run the suite against the sdist,
# and to resolve the exact dependency set the project was tested with.
source-include = ["tests/**", "uv.lock", "LICENSE"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-textual-snapshot>=1.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
# The project dir contains a multi-TB live mirror tree (mirror/) — never let
# pytest collection walk it.
testpaths = ["tests"]
markers = ["network: downloads from the internet (opt-in end-to-end tests)"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["mirror"]

[tool.ruff.lint.per-file-ignores]
# Shipped verbatim to machines running Python 3.6 with no pip. Modern syntax,
# f-strings with %-style alternatives, and pathlib are all deliberate omissions.
"src/mmw/resources/apply.py" = ["UP", "PTH", "SIM", "C4"]
